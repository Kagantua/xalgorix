name: Build Linux amd64 Binary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Use latest Ubuntu runner (Linux)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.2' # As specified in README requirements
        check-latest: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use LTS version for building the Web UI
        cache: 'npm'
        cache-dependency-path: 'webui/package-lock.json'

    - name: Install Web UI dependencies
      run: |
        cd webui
        npm ci
      # 'npm ci' uses package-lock.json for faster, reliable installs

    - name: Build Web UI
      run: |
        cd webui
        npm run build
      # This should generate the static files that the Go binary will embed

    - name: Build Go binary for Linux amd64
      run: |
        # Set environment variables for cross-compilation to Linux amd64
        # We are already on Linux, but explicitly set GOOS and GOARCH for clarity and safety
        make build
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 0 # Optional: Creates a static binary, good for portability

    - name: Verify binary
      run: |
        file build/xalgorix
        ls -lh build/xalgorix

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: xalgorix-linux-amd64
        path: build/xalgorix
        if-no-files-found: error
